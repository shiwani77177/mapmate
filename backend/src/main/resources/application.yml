spring:
  application:
    name: mapmate-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mapmate}
    username: ${DB_USER:mapmate}
    password: ${DB_PASSWORD:mapmate}
  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns the schema, Hibernate only validates
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080
